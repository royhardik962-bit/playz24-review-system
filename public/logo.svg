<svg xmlns="http://www.w3.org/2000/svg" width="160" height="62" viewBox="0 0 160 62" fill="none">
  <defs>
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-text" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="badge-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a5e"/>
      <stop offset="100%" stop-color="#071040"/>
    </linearGradient>
  </defs>

  <!-- Controller icon group -->
  <g filter="url(#glow-cyan)" transform="translate(3, 2)">
    <!-- Controller body -->
    <rect x="10" y="8" width="56" height="21" rx="11" ry="11" stroke="#22e8ff" stroke-width="3" fill="none"/>
    <!-- Left grip -->
    <path d="M14 19 Q8 19 7 27 Q6 31 10 32" stroke="#22e8ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Right grip -->
    <path d="M62 19 Q68 19 69 27 Q70 31 66 32" stroke="#22e8ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- D-pad cross -->
    <rect x="20" y="13" width="3" height="11" rx="1.5" fill="#22e8ff"/>
    <rect x="17" y="16" width="9" height="4" rx="1.5" fill="#22e8ff"/>
    <!-- ABXY buttons -->
    <circle cx="54" cy="15" r="2.5" fill="#22e8ff"/>
    <circle cx="60" cy="18" r="2.5" fill="#22e8ff"/>
    <circle cx="54" cy="21" r="2.5" fill="#22e8ff"/>
    <circle cx="48" cy="18" r="2.5" fill="#22e8ff"/>
    <!-- Center buttons -->
    <rect x="34" y="16" width="8" height="5" rx="2.5" fill="#22e8ff" opacity="0.7"/>
    <rect x="44" y="16" width="8" height="5" rx="2.5" fill="#22e8ff" opacity="0.7"/>
  </g>

  <!-- PLAYZ24 text -->
  <g transform="translate(2, 28)">
    <!-- Skew background bar -->
    <rect x="2" y="0" width="110" height="26" rx="2" fill="none"/>
    <!-- White horizontal lines (top + bottom of text) -->
    <line x1="2" y1="1" x2="112" y2="1" stroke="white" stroke-width="1.5" opacity="0.85"/>
    <line x1="2" y1="26" x2="112" y2="26" stroke="#596aff" stroke-width="1.5" opacity="0.85"/>

    <!-- PLAYZ text -->
    <text
      x="4" y="22"
      font-family="'Arial Black', 'Arial', sans-serif"
      font-size="24"
      font-weight="900"
      font-style="italic"
      fill="white"
      letter-spacing="-1"
      filter="url(#glow-text)"
    >PLAYZ</text>

    <!-- 24 in yellow -->
    <text
      x="82" y="22"
      font-family="'Arial Black', 'Arial', sans-serif"
      font-size="24"
      font-weight="900"
      font-style="italic"
      fill="#ffd92f"
      letter-spacing="-1"
    >24</text>

    <!-- Blue shadow for depth on PLAYZ24 -->
    <text
      x="6" y="24"
      font-family="'Arial Black', 'Arial', sans-serif"
      font-size="24"
      font-weight="900"
      font-style="italic"
      fill="#243caa"
      letter-spacing="-1"
      opacity="0.5"
      style="pointer-events:none"
    >PLAYZ24</text>
  </g>

  <!-- GAMING CAFE badge -->
  <g transform="translate(2, 54)">
    <rect x="0" y="0" width="108" height="9" rx="2" fill="url(#badge-bg)" stroke="#20eaff" stroke-width="0.8"/>
    <text
      x="54" y="7.5"
      font-family="'Courier New', monospace"
      font-size="6.5"
      font-weight="700"
      fill="#20eaff"
      text-anchor="middle"
      letter-spacing="1.2"
      filter="url(#glow-cyan)"
    >GAMING CAFE</text>
  </g>
</svg>
